<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CODEX700 - LOGIN</title>
<style>
body{background:#000;color:#ffcc33;font-family:Arial;margin:0;padding:20px;text-align:center}
.header{font-size:28px;font-weight:bold;margin:20px 0}
.box{border:2px solid #ffaa00;border-radius:20px;padding:25px 20px;max-width:380px;margin:auto;background:#0a0a0a;box-shadow:0 0 20px #ffaa00}
.box h2{color:#ffcc33}
label{display:block;text-align:left;margin:12px 0 6px;color:#ffcc33}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #ffaa00;background:#111;color:#fff;box-sizing:border-box}
.btn{width:100%;margin-top:20px;padding:15px;border:none;border-radius:12px;background:linear-gradient(#ffcc33,#ff9900);font-weight:bold;font-size:18px}
a{color:#ffcc33}.link{margin-top:15px;color:#fff}
</style>
</head>
<body>
<div class="header">CODEX700</div>
<div class="box">
<h2>LOGIN</h2>
<form method="POST" action="/login">
<label>Phone number</label><input name="phone" placeholder="Enter Phone number" required>
<label>Password</label><input type="password" name="password" placeholder="Enter Password" required>
<button class="btn">LOGIN</button>
</form>
<div class="link">No account? <a href="register.html">Register</a></div>
</div>
</body>
</html>
