<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#070710;color:#fff;font-family:Arial;margin:0;padding-bottom:90px}
.top{padding:14px 16px;background:#0a1026;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a2a50}
.card{margin:12px;background:linear-gradient(180deg,#131e3d,#0a1026);border:1px solid #1a2f6a;border-radius:16px;padding:14px}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:900;margin-bottom:8px}
.badge.withdrawal{background:#00ff88;color:#000}.badge.deposit{background:#00aaff;color:#fff}
.badge.ai{background:#a855f7;color:#fff}.badge.team{background:#ffaa00;color:#000}
.badge.invite{background:#ff0055;color:#fff}.badge.live{background:#00ff88;color:#000}
.badge.update{background:#00e5ff;color:#000}.badge.security{background:#ff4444;color:#fff}
.badge.new{background:#ffaa00;color:#000}.badge.raffle{background:#ffd700;color:#000}
.title{font-weight:900;font-size:15px}.msg{font-size:13px;color:#a0b0d0;margin-top:8px;line-height:1.5}
.time{font-size:10px;color:#555;margin-top:10px}
.tab{display:flex;gap:8px;padding:12px;overflow-x:auto}
.tab button{background:#131e3d;border:1px solid #1a2f6a;color:#7a8aaa;padding:6px 14px;border-radius:20px;white-space:nowrap}
.tab button.active{background:#00e5ff;color:#000;border-color:#00e5ff;font-weight:900}
</style></head><body>
<div class="top"><a href="/" style="color:#00e5ff;text-decoration:none">← Home</a><div style="font-weight:900">News & Announcements</div><div style="width:40px"></div></div>
<div class="tab" id="tabs"><button class="active" onclick="filter('all')">All</button><button onclick="filter('withdrawal')">Withdraw</button><button onclick="filter('deposit')">Deposit</button><button onclick="filter('ai')">AI Income</button><button onclick="filter('team')">Team</button></div>
<div id="list"></div>
<script>
let all=[];
fetch('/static/announcements.json').then(r=>r.json()).then(d=>{all=d; render('all')});
function render(f){
let html="";
all.filter(a=>f=='all'||a.type==f).forEach(a=>{
html+=`<div class="card"><div class="badge ${a.type}">${a.type.toUpperCase()}</div><div class="title">${a.title}</div><div class="msg">${a.msg}</div><div class="time">${a.time}</div></div>`;
});
document.getElementById('list').innerHTML=html;
document.querySelectorAll('.tab button').forEach(b=>b.classList.toggle('active', b.textContent.toLowerCase().includes(f)|| (f=='all'&&b.textContent=='All')));
}
function filter(t){render(t)}
</script></body></html>
