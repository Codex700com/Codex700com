<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
h1{color:#ff2222;text-align:center;margin:5px}
.sub{color:#ff2222;text-align:center;margin-bottom:10px}
.tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:10px}
.tabs button{background:#222;color:#fff;border:1px solid #444;padding:8px 12px;border-radius:20px;white-space:nowrap}
.tabs button.active{background:#ff2222}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#111;border:1px solid #333;border-radius:12px;overflow:hidden}
.top{background:linear-gradient(180deg,#d4a017,#8a5a00);height:120px;display:flex;align-items:center;justify-content:center;position:relative}
.top img{width:100%;height:140%;object-fit:cover;object-position:bottom;margin-top:-25px}
.badge{position:absolute;top:8px;left:8px;background:#ff2222;color:#fff;padding:3px 10px;border-radius:20px;font-size:12px}
.info{padding:10px}
.info b{color:#ff2222}
.row{display:flex;justify-content:space-between;font-size:12px;margin:4px 0}
.row span{color:#888}
.row strong{color:#ff2222}
.total{background:#1a0000;text-align:center;padding:8px;border-radius:8px;margin:8px 0}
.total strong{color:#ff2222;font-size:16px}
.btn{background:#ff2222;color:#fff;border:none;width:100%;padding:10px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<h1>INVESTMENT PLANS</h1>
<div class="sub">Choose a plan that suits you</div>
<div class="tabs">
<button class="active" onclick="show('A',this)">CODEX A SERIES</button><button onclick="show('M',this)">CODEX M SERIES</button>
<button onclick="show('L',this)">CODEX L SERIES</button>
<button onclick="show('GS',this)">CODEX GS SERIES</button>
<button onclick="show('J',this)">CODEX J SERIES</button>
</div>
<div id="grid" class="grid"></div>
<script>
const D={
A:[["A1",20000,3000,16],["A2",100000,9000,15]],
M:[["M1",50000,10000],["M2",100000,20000],["M3",250000,50000],["M4",500000,100000],["M5",1000000,200000],["M6",2000000,400000],["M7",5000000,1000000]],
L:[["L1",500000,110000],["L2",1000000,220000],["L3",2000000,440000]],
GS:[["GS1",600000,132000],["GS2",1200000,264000],["GS3",2500000,550000]],
J:[["J1",800000,176000],["J2",1500000,330000],["J3",3000000,660000]]
};
function show(k,btn){
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
let h='';
D[k].forEach(x=>{
let dur=x[3]||30;let price=x[1].toLocaleString();
let daily=x[2].toLocaleString();
let total=(x[2]*dur).toLocaleString();
h+=`<div class="card"><div class="top"><div class="badge">🔥 HOT</div><img src="/static/miner.jpg"></div><div class="info"><b>${x[0]} Plan Lock 🔒</b><div class="row"><span>PRICE</span><span>DURATION</span></div><div class="row"><strong>UGX ${price}</strong><strong>${dur} Days</strong></div><div class="row"><span>DAILY RETURN</span><span>TOTAL RETURN</span></div><div class="row"><strong>UGX ${daily}</strong><strong>UGX ${total}</strong></div><div class="total"><span>TOTAL RECEIVED</span><br><strong>UGX ${total}</strong></div><button class="btn" onclick="buy('${x[0]}')">🛒 Invest Now</button></div></div>`;
});
document.getElementById('grid').innerHTML=h;
}
function buy(p){ location.href='/buy/'+p; }
show('A',document.querySelector('.tabs button'));
</script>
</body>
</html>
