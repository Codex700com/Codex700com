<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{background:#020210!important}</style><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#020210;color:#fff;padding-bottom:90px}.tabs{display:flex;gap:18px;overflow-x:auto;padding:14px 16px;border-bottom:1px solid #0f1a33}.tabs div{color:#6b7a9e;font-size:13px;font-weight:700;padding-bottom:4px;border-bottom:2px solid transparent}.tabs div.active{color:#fff;border-bottom-color:#00e5ff}.card{margin:14px 12px;background:linear-gradient(180deg,#131e3d,#0a1026);border:1px solid rgba(0,229,255,0.22);border-radius:20px;overflow:hidden}.img{height:165px;position:relative;background:#000}.img img{width:100%;height:100%;object-fit:cover}.badge1{position:absolute;top:10px;left:12px;background:#061432;border:1px solid #00e5ff;color:#00e5ff;font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px}.badge2{position:absolute;top:10px;right:12px;background:rgba(0,0,0,0.6);color:#8affd1;font-size:10px;padding:4px 10px;border-radius:20px}.body{padding:12px 14px 14px}.row{display:flex;justify-content:space-between}.name{font-size:22px;font-weight:900;color:#d6f3ff}.live{color:#00ff9c;font-size:11px;font-weight:700;margin-top:3px}.pl{font-size:9px;color:#7a8aaa;text-align:right}.pv{font-size:15px;font-weight:900;margin-top:2px}.stats{display:flex;justify-content:space-between;margin-top:12px;background:rgba(0,0,0,0.38);border:1px solid rgba(255,255,255,0.06);padding:10px 4px;border-radius:14px}.s{flex:1;text-align:center}.sl{font-size:9px;color:#7b8ab0}.sv{margin-top:4px;font-size:12px;font-weight:800}.sv.g{color:#7affc6}.note{margin-top:10px;font-size:11px;color:#8ea0c0;text-align:center}.btn{width:100%;margin-top:12px;background:linear-gradient(90deg,#00c8ff,#0076ff);border:none;border-radius:28px;padding:13px;color:#fff;font-weight:900;font-size:14px}</style></head>
<style>
.live-box{position:relative;background:#0a0e1a;border:1px solid #00d4ff;border-radius:12px;overflow:hidden;padding:12px;margin-bottom:10px}
.live-badge{position:absolute;top:8px;left:8px;background:#00ff88;color:#000;font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;animation:blink 1s infinite}
.hash-now{position:absolute;top:8px;right:8px;color:#00d4ff;font-size:10px;font-family:monospace}
.mine-bar{height:4px;background:#111;border-radius:2px;margin-top:6px;overflow:hidden}
.mine-bar>div{width:87%;height:100%;background:linear-gradient(90deg,#00d4ff,#00ff88);animation:load 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
</style>
<body><div class="tabs" id="tabs"><div class="active" data-c="all">All</div><div data-c="A">CX series</div><div data-c="M">BM series</div><div data-c="L">DS series</div></div><div id="cards"></div><script>const P=[{n:"CX-1",c:"A",p:250000,d:20000,e:"2030",y:7300000,i:"https://images.unsplash.com/photo-1677442136019-21780ecad995?w=700",r:"ROI 180%"},{n:"CX-2",c:"A",p:500000,d:40000,e:"2030",y:14400000,i:"https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=700",r:"ROI 210%"},{n:"BM-1",c:"M",p:1000000,d:85000,e:"2030",y:30600000,i:"https://images.unsplash.com/photo-1639762681057-408e52192e55?w=700",r:"HOT"},{n:"BM-2",c:"M",p:2000000,d:180000,e:"2030",y:64800000,i:"https://images.unsplash.com/photo-1642104704074-907c0698cbd9?w=700",r:"HOT"},{n:"DS-1",c:"L",p:3500000,d:320000,e:"2030",y:115200000,i:"https://images.unsplash.com/photo-1677442136019-21780ecad995?w=700",r:"VIP"},{n:"E-1",c:"L",p:5000000,d:500000,e:"2030",y:180000000,i:"https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=700",r:"VIP MAX"}];function R(cat){let h="";P.filter(x=>cat=="all"||x.c==cat).forEach(x=>{h+=`<div class="card"><div class="img"><img src="${x.i}"><div class="badge1">${x.c} SERIES</div><div class="badge2">${x.r}</div></div><div class="body"><div class="row"><div><div class="name">${x.n}</div><div class="live">● MINING LIVE</div></div><div><div class="pl">PRICE</div><div class="pv">${x.p.toLocaleString()}.00</div></div></div><div class="stats"><div class="s"><div class="sl">DAILY</div><div class="sv g">${x.d.toLocaleString()}.00</div></div><div class="s"><div class="sl">EXPIRES</div><div class="sv">${x.e}</div></div><div class="s"><div class="sl">PER YEAR</div><div class="sv">${x.y.toLocaleString()}.00</div></div></div><div class="note">Earns ${x.d.toLocaleString()} daily — withdraw until ${x.e}</div><button class="btn" onclick="location.href='/product?p=${x.n}'">Buy machine</button></div></div>`});document.getElementById('cards').innerHTML=h}document.querySelectorAll('#tabs div').forEach(el=>{el.onclick=()=>{document.querySelectorAll('#tabs div').forEach(d=>d.classList.remove('active'));el.classList.add('active');R(el.dataset.c)}});R('all');</script><script>setInterval(()=>{document.querySelectorAll(".hval").forEach(e=>e.innerText=(2+Math.random()).toFixed(2)+" PH/s")},1200)</script></body></html>
