<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#020210;color:#fff;padding-bottom:90px}
.tabs{display:flex;gap:18px;overflow-x:auto;padding:14px 16px;border-bottom:1px solid #0f1a33}.tabs div{color:#6b7a9e;font-size:13px;font-weight:700;padding-bottom:4px;border-bottom:2px solid transparent;cursor:pointer}.tabs div.active{color:#fff;border-bottom-color:#00e5ff}
.card{margin:14px 12px;background:linear-gradient(180deg,#131e3d,#0a1026);border:1px solid rgba(0,229,255,0.22);border-radius:20px;overflow:hidden}
.img{height:185px;position:relative;background:#000;overflow:hidden}.img video{width:100%;height:100%;object-fit:cover;opacity:0.7}.img .miner-float{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:62%;filter:drop-shadow(0 0 18px #00d4ff);animation:float 2.5s infinite ease-in-out}
.badge1{position:absolute;top:10px;left:12px;background:#061432;border:1px solid #00e5ff;color:#00e5ff;font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;z-index:3}
.badge2{position:absolute;top:10px;right:12px;background:rgba(0,0,0,0.7);color:#00ff88;font-size:10px;padding:4px 10px;border-radius:20px;border:1px solid #00ff88;z-index:3;animation:blink 1s infinite}
.badge3{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.8);color:#00d4ff;font-size:9px;font-family:monospace;padding:3px 7px;border-radius:6px;z-index:3}
.body{padding:12px 14px 14px}.row{display:flex;justify-content:space-between}.name{font-size:22px;font-weight:900;color:#d6f3ff}.live{color:#00ff9c;font-size:11px;font-weight:700;margin-top:3px}
.pl{font-size:9px;color:#7a8aaa;text-align:right}.pv{font-size:15px;font-weight:900;margin-top:2px}.stats{display:flex;justify-content:space-between;margin-top:12px;background:rgba(0,0,0,0.38);border:1px solid rgba(255,255,255,0.06);padding:10px 4px;border-radius:14px}.s{flex:1;text-align:center}.sl{font-size:9px;color:#7b8ab0}.sv{margin-top:4px;font-size:12px;font-weight:800}.sv.g{color:#7affc6}
.note{margin-top:10px;font-size:11px;color:#8ea0c0;text-align:center}.btn{width:100%;margin-top:12px;background:linear-gradient(90deg,#00c8ff,#0076ff);border:none;border-radius:28px;padding:13px;color:#fff;font-weight:900;font-size:14px;cursor:pointer}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-7px)}}
</style></head>
<body>
<div class="tabs" id="tabs"><div class="active" data-c="all">All</div><div data-c="A">CODEX-A (Live Robots)</div><div data-c="M">BM series</div><div data-c="L">DS series (100 Days)</div></div>
<div id="cards"></div>
<script>
const P=[
{n:"CODEX-A1",c:"A",p:250000,d:8000,e:"100 Days",y:800000,i:"/static/ai/codex_a1.png",r:"● 7 ROBOTS LIVE",vid:"https://cdn.pixabay.com/video/2020/08/12/46497-447809677_large.mp4"},
{n:"CODEX-A2",c:"A",p:500000,d:18000,e:"100 Days",y:1800000,i:"/static/ai/codex_a2.png",r:"● 12 ROBOTS LIVE",vid:"https://cdn.pixabay.com/video/2022/08/03/126502-734027891_large.mp4"},
{n:"CODEX-A3",c:"A",p:1000000,d:40000,e:"100 Days",y:4000000,i:"/static/ai/codex_a3.png",r:"● 20 ROBOTS LIVE",vid:"https://cdn.pixabay.com/video/2020/12/14/59681-490824882_large.mp4"},
{n:"CODEX-A4",c:"A",p:2000000,d:90000,e:"100 Days",y:9000000,i:"/static/ai/codex_a4.png",r:"● 35 ROBOTS LIVE",vid:"https://cdn.pixabay.com/video/2020/08/12/46497-447809677_large.mp4"},
{n:"BM-1",c:"M",p:3500000,d:150000,e:"100 Days",y:15000000,i:"/static/ai/s.jpg",r:"HOT"},
{n:"DS-1",c:"L",p:5000000,d:250000,e:"100 Days",y:25000000,i:"/static/ai/codex_a1.png",r:"VIP 100D"}
];
function R(cat){
 let h="";
 P.filter(x=>cat=="all"||x.c==cat).forEach(x=>{
  let media = x.vid ? `<video autoplay muted loop playsinline><source src="${x.vid}" type="video/mp4"></video><img class="miner-float" src="${x.i}">` : `<img src="${x.i}" style="width:100%;height:100%;object-fit:cover">`;
  h+=`<div class="card"><div class="img">${media}<div class="badge1">${x.c} SERIES • ${x.e}</div><div class="badge2">${x.r}</div><div class="badge3">HASH: <span class="hval">${(2+Math.random()).toFixed(2)} PH/s</span></div></div>
  <div class="body"><div class="row"><div><div class="name">${x.n}</div><div class="live">🤖 LIVE MINING • BLOCK #<span class="bval">892347</span></div></div><div><div class="pl">PRICE</div><div class="pv">UGX ${x.p.toLocaleString()}</div></div></div>
  <div class="stats"><div class="s"><div class="sl">DAILY</div><div class="sv g">UGX ${x.d.toLocaleString()}</div></div><div class="s"><div class="sl">DURATION</div><div class="sv">${x.e}</div></div><div class="s"><div class="sl">TOTAL</div><div class="sv">UGX ${x.y.toLocaleString()}</div></div></div>
  <div class="note">🤖 Live robots mining 24/7 — Earns UGX ${x.d.toLocaleString()} daily for ${x.e}</div><button class="btn" onclick="location.href='/product?p=${x.n}'">Buy Live Miner</button></div></div>`
 });
 document.getElementById('cards').innerHTML=h
}
document.querySelectorAll('#tabs div').forEach(el=>{el.onclick=()=>{document.querySelectorAll('#tabs div').forEach(d=>d.classList.remove('active'));el.classList.add('active');R(el.dataset.c)}});
R('all');
setInterval(()=>{
  document.querySelectorAll('.hval').forEach(e=>e.innerText=(1.5+Math.random()*4).toFixed(2)+' PH/s');
  document.querySelectorAll('.bval').forEach(e=>e.innerText=String(892300+Math.floor(Math.random()*700)));
}, 900);
</script>
</body></html>
