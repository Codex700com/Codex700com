<!DOCTYPE html>
<html>
<head><style>/* CODEX BLUE-BLACK-WHITE THEME */body{background:#000!important;color:#fff!important}.card,.box,.panel{background:#111!important;border:1px solid #00b0ff!important;color:#fff!important}button,.btn{background:#00b0ff!important;color:#000!important;border:none!important;font-weight:700}a{color:#00b0ff!important}input,select,textarea{background:#111!important;color:#fff!important;border:1px solid #00b0ff!important}h1,h2,h3{color:#fff!important}</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
h1{color:#1da1f2;text-align:center;margin:5px}
.sub{color:#1da1f2;text-align:center;margin-bottom:10px}
.tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:10px}
.tabs button{background:#222;color:#fff;border:1px solid #444;padding:8px 12px;border-radius:20px;white-space:nowrap}
.tabs button.active{background:#1da1f2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#111;border:1px solid #333;border-radius:12px;overflow:hidden}
.top{background:linear-gradient(180deg,#d4a017,#8a5a00);height:120px;display:flex;align-items:center;justify-content:center;position:relative}
.top img{width:100%;height:140%;object-fit:cover;object-position:bottom;margin-top:-25px}
.badge{position:absolute;top:8px;left:8px;background:#1da1f2;color:#fff;padding:3px 10px;border-radius:20px;font-size:12px}
.info{padding:10px}
.info b{color:#1da1f2}
.row{display:flex;justify-content:space-between;font-size:12px;margin:4px 0}
.row span{color:#888}
.row strong{color:#1da1f2}
.total{background:#1a0000;text-align:center;padding:8px;border-radius:8px;margin:8px 0}
.total strong{color:#1da1f2;font-size:16px}
.btn{background:#1da1f2;color:#fff;border:none;width:100%;padding:10px;border-radius:8px;font-weight:bold}
</style>
<style>html,body{touch-action:pan-x pan-y;overscroll-behavior:none}*{ -webkit-text-size-adjust:100%; }</style><script>document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});</script>
<style>
:root{ --main-blue:#00b0ff !important; }
body{ background:#000 !important; color:#fff !important; }
.card, .info-box, .detail-card{ background:#111 !important; border-radius:12px !important; }
.price, .amount-blue{ color:#00b0ff !important; font-weight:700; }
.btn-primary, .invest-btn, button[type=submit]{ background:#00b0ff !important; border:none !important; color:#fff !important; border-radius:10px !important; }
</style>
<style>:root{--main-blue:#00b0ff!important}body{background:#000!important}button,.btn,.btn-primary,.invest-btn,input[type=submit]{background:#00b0ff!important;border-color:#00b0ff!important;color:#fff!important}*{border-color:#00b0ff33!important}</style>

<style>body{font-size:14px!important;line-height:1.4!important}h1{font-size:20px!important}h2{font-size:18px!important}h3{font-size:16px!important}p,div,span,a,button{font-size:14px!important}</style></head>

<body>
<h1>INVESTMENT PLANS</h1>
<div class="sub">Choose a plan that suits you</div>
<div class="tabs">
<button class="active" onclick="show('A',this)">CODEX A SERIES</button><button onclick="show('M',this)">CODEX M SERIES</button>
<button onclick="show('L',this)">CODEX L SERIES</button>
<button onclick="show('GS',this)">CODEX GS SERIES</button>
<button onclick="show('J',this)">CODEX J SERIES</button>
<button onclick="show('K',this)">CODEX K SERIES</button>
</div>
<div id="grid" class="grid"></div>
<script>
const D={K:[["K1",1000000,250000],["K2",5000000,1250000],["K3",10000000,2500000],["K4",50000000,12500000]],
A:[["A1",20000,3000,16],["A2",100000,9000,15]],
M:[["M1",50000,10000],["M2",100000,20000],["M3",250000,50000],["M4",500000,100000],["M5",1000000,200000],["M6",2000000,400000],["M7",5000000,1000000]],
L:[["L1",500000,110000],["L2",1000000,220000],["L3",2000000,440000]],
GS:[["GS1",600000,132000],["GS2",1200000,264000],["GS3",2500000,550000]],
J:[["J1",800000,176000],["J2",1500000,330000],["J3",3000000,660000]]
};
function show(k,btn){
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
let h='';
D[k].forEach(x=>{
let dur=x[3]||30;let price=x[1].toLocaleString();
let daily=x[2].toLocaleString();
let total=(x[2]*dur).toLocaleString();
h+=`<div class="card"><div class="top"><div class="badge">🔥 HOT</div><img src="${x[0][0]=='K'?'/static/miner_k.jpg':'/static/miner.jpg'}"></div><div class="info"><b>${x[0]} Plan Lock 🔒</b><div class="row"><span>PRICE</span><span>DURATION</span></div><div class="row"><strong>UGX ${price}</strong><strong>${dur} Days</strong></div><div class="row"><span>DAILY RETURN</span><span>TOTAL RETURN</span></div><div class="row"><strong>UGX ${daily}</strong><strong>UGX ${total}</strong></div><div class="total"><span>TOTAL RECEIVED</span><br><strong>UGX ${total}</strong></div><button class="btn" onclick="buy('${x[0]}')">🛒 Invest Now</button></div></div>`;
});
document.getElementById('grid').innerHTML=h;
}
function buy(p){ location.href='/product?p='+p; }
show('A',document.querySelector('.tabs button'));
</script>
<script>
setInterval(async()=>{
 try{
  let r=await fetch('/api/notifs'); let j=await r.json();
  if(j.notifs && j.notifs.length){
   let last=localStorage.getItem('ln')||0;
   if(String(j.notifs[0].id)!=String(last)){ alert(j.notifs[0].msg); localStorage.setItem('ln', j.notifs[0].id); }
  }
 }catch(e){}
},5000);
</script>
</body>
</html>
