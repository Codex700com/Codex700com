<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Support</title><style>
body{background:#000;color:#fff;font-family:Arial;margin:0;display:flex;flex-direction:column;height:100vh}
.top{background:#0f0f0f;padding:8px 12px;color:#ffcc00;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.header{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #222}
.avatar{width:48px;height:48px;background:#1e90ff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.online{color:#00ff00;font-size:12px}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.empty{color:#888;text-align:center;margin-top:40px}
.msg{max-width:75%;padding:10px 14px;border-radius:15px;word-wrap:break-word}
.me{align-self:flex-end;background:#1e90ff;color:#fff;border-bottom-right-radius:5px}
.bot{align-self:flex-start;background:#1a1a1a;border:1px solid #333;border-bottom-left-radius:5px}
.inputbar{display:flex;align-items:center;gap:8px;padding:10px;background:#000;border-top:1px solid #222}
.icon{width:42px;height:42px;background:#1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid #333}
#tin{flex:1;background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px;border-radius:25px;outline:none}
#send{width:45px;height:45px;background:#1e6fb8;border:none;border-radius:50%;color:#fff;font-size:18px;cursor:pointer}
</style><style>html,body{touch-action:pan-x pan-y;overscroll-behavior:none}*{ -webkit-text-size-adjust:100%; }</style><script>document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});</script>
<style>
:root{ --main-blue:#00b0ff !important; }
body{ background:#000 !important; color:#fff !important; }
.card, .info-box, .detail-card{ background:#111 !important; border-radius:12px !important; }
.price, .amount-blue{ color:#00b0ff !important; font-weight:700; }
.btn-primary, .invest-btn, button[type=submit]{ background:#00b0ff !important; border:none !important; color:#fff !important; border-radius:10px !important; }
</style>
<style>:root{--main-blue:#00b0ff!important}body{background:#000!important}button,.btn,.btn-primary,.invest-btn,input[type=submit]{background:#00b0ff!important;border-color:#00b0ff!important;color:#fff!important}*{border-color:#00b0ff33!important}</style><style>/* J2_THEME */
body{background:#000!important;color:#fff!important}
.card,.box,.container,.panel{background:#111!important;color:#fff!important;border:1px solid #222!important}
h1,h2,h3,h4,p,span,div,label{color:#fff!important}
a{color:#00b0ff!important}
button,.btn,.btn-primary,.invest-btn,input[type=submit]{background:#00b0ff!important;border:none!important;color:#fff!important;font-weight:700!important;border-radius:10px!important}
input,select,textarea{background:#1a1a1a!important;color:#fff!important;border:1px solid #00b0ff55!important}
.price,.amount,.balance{color:#00b0ff!important;font-weight:800!important}
</style></head><body>
<div class="top"><span>📌 How to Deposit & Withdraw</span><span>▼</span></div>
<div class="header"><a href="/" style="color:#1e90ff;text-decoration:none;font-size:20px">←</a><div class="avatar">🎧</div><div><div style="font-weight:bold">Support</div><div class="online">Online</div></div></div>
<div id="chat"><div class="empty" id="empty">No messages yet. Start a conversation!</div></div>
<div class="inputbar">
<div class="icon" onclick="alert('Attach file coming soon')">📎</div>
<div class="icon" onclick="document.getElementById('imgIn').click()">🖼️</div>
<div class="icon" onclick="alert('Camera coming soon')">📷</div>
<input type="file" id="imgIn" accept="image/*" style="display:none">
<input id="tin" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMsg()">
<button id="send" onclick="sendMsg()">➤</button>
</div>
<script>
let msgs=JSON.parse(localStorage.getItem('support_msgs')||'[]');
function render(){
 let c=document.getElementById('chat');c.innerHTML='';
 if(msgs.length===0){c.innerHTML='<div class="empty">No messages yet. Start a conversation!</div>';return;}
 msgs.forEach(m=>{
  let d=document.createElement('div');d.className='msg '+(m.me?'me':'bot');
  if(m.img){let im=document.createElement('img');im.src=m.img;im.style.maxWidth='200px';im.style.borderRadius='10px';d.appendChild(im);}else{d.textContent=m.text;}
  c.appendChild(d);
 });
 c.scrollTop=c.scrollHeight;
}
async function loadMsgs(){
 try{
  let r=await fetch('/api/chat'); let j=await r.json();
  let c=document.getElementById('chat'); c.innerHTML='';
  if(!j.length){c.innerHTML='<div class="empty">No messages yet. Start a conversation!</div>';return;}
  j.slice(-30).forEach(m=>{
   let d=document.createElement('div'); d.className='msg '+(m.mine?'me':'bot');
   d.textContent=(m.user?m.user+': ':'')+m.text;
   c.appendChild(d);
  });
  c.scrollTop=c.scrollHeight;
 }catch(e){}
}
function sendMsg(){
 let inp=document.getElementById('tin');let txt=inp.value.trim();if(!txt)return;
 fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt,user:'me'})}).then(()=>{inp.value=''; loadMsgs();});

 // auto-reply removed - admin will reply via /admin/chats
}
document.getElementById('imgIn').onchange=function(e){
 let f=e.target.files[0];if(!f)return;let r=new FileReader();
 r.onload=function(){msgs.push({img:r.result,me:true});localStorage.setItem('support_msgs',JSON.stringify(msgs));loadMsgs(); setInterval(loadMsgs,3000);};
 r.readAsDataURL(f);
};
loadMsgs(); setInterval(loadMsgs,3000);
</script>
<script>
setInterval(async()=>{
 try{
  let r=await fetch('/api/notifs'); let j=await r.json();
  if(j.notifs && j.notifs.length){
   let last=localStorage.getItem('ln')||0;
   if(String(j.notifs[0].id)!=String(last)){ alert(j.notifs[0].msg); localStorage.setItem('ln', j.notifs[0].id); }
  }
 }catch(e){}
},5000);
</script>
</body></html>
