<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#111b21;height:100vh;display:flex;flex-direction:column}
.top{background:#202c33;color:#fff;padding:12px;display:flex;gap:12px;align-items:center}
.chat-bg{flex:1;overflow-y:auto;padding:12px;background:#0b141a}
.bubble{max-width:75%;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px}
.me{background:#005c4b;color:#fff;margin-left:auto}.them{background:#202c33;color:#fff;margin-right:auto}
.input-bar{background:#202c33;padding:8px;display:flex;gap:6px}
.input-bar input{flex:1;background:#2a3942;border:none;border-radius:20px;padding:12px;color:#fff;outline:none}
.btn{background:#00a884;border:none;width:45px;height:45px;border-radius:50%;color:#fff}
.chat-img{max-width:200px;border-radius:8px;display:block;margin-bottom:4px}
</style></head><body>
<div class="top"><a href="/home" style="color:#fff;text-decoration:none">←</a> <b>Support Team</b></div>
<div class="chat-bg" id="chatBox"></div>
<div class="input-bar">
<label style="background:#2a3942;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer">📎<input type="file" id="imgInput" accept="image/*" hidden onchange="sendImage()"></label>
<input id="msgInput" placeholder="Message"><button class="btn" onclick="sendMsg()">➤</button>
</div>
<script>
async function load(){let r=await fetch('/api/chat/history');let d=await r.json();let b=document.getElementById('chatBox');b.innerHTML='';d.forEach(m=>{let div=document.createElement('div');div.className='bubble me';let h='';if(m.image)h+=`<img src="/${m.image}" class="chat-img" onclick="window.open(this.src)">`;h+=`${m.message||''}`;if(m.admin_reply)h+=`<div style="border-top:1px solid #333;margin-top:5px;color:#53bdeb"><b>Support:</b> ${m.admin_reply}</div>`;div.innerHTML=h;b.appendChild(div);});b.scrollTop=b.scrollHeight;}
async function sendMsg(){let i=document.getElementById('msgInput');let t=i.value.trim();if(!t)return;i.value='';await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});load();}
async function sendImage(){let f=document.getElementById('imgInput').files[0];if(!f)return;let fd=new FormData();fd.append('image',f);await fetch('/api/chat/send-image',{method:'POST',body:fd});load();}
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendMsg()});load();setInterval(load,3000);
</script></body></html>
