<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto}
html,body{height:100%;overflow:hidden;background:#111b21}
body{display:flex;flex-direction:column}
.top{height:60px;background:#202c33;color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0}
.top a{color:#fff;text-decoration:none;font-size:22px}
.top img{width:38px;height:38px;border-radius:50%;background:#00a884}
.top b{font-size:16px}
.top small{color:#8696a0;font-size:12px}
.chat-bg{flex:1;overflow-y:auto;padding:12px 8px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');background-size:400px}
.bubble{max-width:78%;padding:8px 10px 5px 10px;border-radius:8px;margin:4px 0;position:relative;word-break:break-word;font-size:15px;line-height:19px;box-shadow:0 1px 0.5px rgba(0,0,0,.13)}
.me{background:#005c4b;color:#e9edef;margin-left:auto;border-top-right-radius:0}
.them{background:#202c33;color:#e9edef;margin-right:auto;border-top-left-radius:0}
.time{display:block;text-align:right;font-size:11px;color:#8696a0;margin-top:4px}
.time.check{color:#53bdeb}
.chat-img{width:100%;max-width:220px;border-radius:6px;display:block;margin-bottom:4px;cursor:pointer}
.input-bar{background:#202c33;padding:6px 8px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.input-bar.field{flex:1;background:#2a3942;border-radius:22px;display:flex;align-items:center;padding:0 12px}
.input-bar.field input{flex:1;background:transparent;border:none;color:#fff;padding:12px 4px;outline:none;font-size:15px}
.icon-btn{width:34px;height:34px;border-radius:50%;background:transparent;border:none;color:#8696a0;font-size:20px;cursor:pointer}
.btn-send{background:#00a884;border:none;width:45px;height:45px;border-radius:50%;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.admin-box{font-size:13px;color:#25d366;margin-top:6px;padding-top:5px;border-top:1px solid rgba(255,255,255,.1)}
</style>
</head>
<body>
<div class="top">
<a href="/home">←</a>
<img src="https://cdn-icons-png.flaticon.com/512/1041/1041916.png">
<div><b>Support Team</b><br><small>Online</small></div>
</div>

<div class="chat-bg" id="chatBox"></div>

<div class="input-bar">
<div class="field">
<label class="icon-btn" style="cursor:pointer">📎<input type="file" id="imgInput" accept="image/*" hidden></label>
<input id="msgInput" type="text" placeholder="Message" autocomplete="off">
</div>
<button class="btn-send" onclick="sendMsg()">➤</button>
</div>

<script>
let box=document.getElementById('chatBox');
async function loadChats(){
  try{
    let r=await fetch('/api/chat/history',{cache:'no-store'});
    let d=await r.json();
    box.innerHTML='';
    if(d.length===0){
      let empty=document.createElement('div');
      empty.style="color:#8696a0;text-align:center;margin-top:40px;font-size:14px";
      empty.innerText="No messages yet. Say hello 👋";
      box.appendChild(empty);
      return;
    }
    d.forEach(m=>{
      // USER MESSAGE
      let div=document.createElement('div');
      div.className='bubble me';
      let html='';
      if(m.image){ html+=`<img src="/${m.image}" class="chat-img" onclick="window.open(this.src,'_blank')">`; }
      if(m.message){ html+=`${escapeHtml(m.message)}`; }
      let t=m.created_at?m.created_at.substring(11,16):'';
      html+=`<span class="time">${t} <span class="check">✓✓</span></span>`;
      if(m.admin_reply){
        html+=`<div class="admin-box"><b>Support:</b> ${m.admin_reply}</div>`;
      }
      div.innerHTML=html;
      box.appendChild(div);
    });
    box.scrollTop=box.scrollHeight;
  }catch(e){ console.log(e) }
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function sendMsg(){
  let inp=document.getElementById('msgInput');
  let txt=inp.value.trim();
  if(!txt) return;
  inp.value='';
  // optimistic show
  let div=document.createElement('div');
  div.className='bubble me';
  div.innerHTML=`${escapeHtml(txt)}<span class="time">now ✓</span>`;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
  await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt})});
  setTimeout(loadChats,500);
}
document.getElementById('imgInput').addEventListener('change', async ()=>{
  let f=document.getElementById('imgInput').files[0];
  if(!f) return;
  let fd=new FormData(); fd.append('image',f);
  // optimistic
  let div=document.createElement('div');
  div.className='bubble me';
  div.innerHTML=`<i>Uploading image...</i><span class="time">now</span>`;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
  await fetch('/api/chat/send-image',{method:'POST',body:fd});
  document.getElementById('imgInput').value='';
  loadChats();
});
document.getElementById('msgInput').addEventListener('keypress',e=>{ if(e.key==='Enter') sendMsg(); });
loadChats();
setInterval(loadChats,3000);
</script>
</body>
</html>
