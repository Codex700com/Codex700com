<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#111b21;height:100vh;display:flex;flex-direction:column}
.top{background:#202c33;color:#fff;padding:12px;display:flex;gap:10px;align-items:center}
.chat-bg{flex:1;overflow-y:auto;padding:12px;background:#0b141a;background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.bubble{max-width:75%;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px;position:relative}
.me{background:#005c4b;color:#fff;margin-left:auto;border-top-right-radius:0}
.them{background:#202c33;color:#fff;margin-right:auto;border-top-left-radius:0}
.time{font-size:11px;color:#8696a0;float:right;margin-left:8px;margin-top:4px}
.input-bar{background:#202c33;padding:8px;display:flex;gap:6px;align-items:center}
.input-bar input[type=text]{flex:1;background:#2a3942;border:none;border-radius:20px;padding:12px;color:#fff;outline:none}
.btn{background:#00a884;border:none;width:45px;height:45px;border-radius:50%;color:#fff;font-size:18px;cursor:pointer}
.icon{width:40px;height:40px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chat-img{max-width:200px;border-radius:8px;display:block;margin-bottom:4px}
</style></head><body>
<div class="top"><a href="/home" style="color:#fff;text-decoration:none;font-size:20px">←</a><img src="https://cdn-icons-png.flaticon.com/512/1041/1041916.png" style="width:35px;height:35px;border-radius:50%"><div><b>Support</b><br><small style="color:#8696a0">Online</small></div></div>
<div class="chat-bg" id="chatBox"></div>
<div class="input-bar">
<label class="icon">📎<input type="file" id="imgInput" accept="image/*" hidden onchange="sendImage()"></label>
<input id="msgInput" type="text" placeholder="Message"><button class="btn" onclick="sendMsg()">➤</button>
</div>
<script>
async function load(){let r=await fetch('/api/chat/history');let d=await r.json();let b=document.getElementById('chatBox');b.innerHTML='';d.forEach(m=>{let div=document.createElement('div');div.className='bubble me';let h='';if(m.image)h+=`<img src="/${m.image}" class="chat-img" onclick="window.open(this.src)">`;h+=`${m.message||''}<span class=time>${m.created_at?m.created_at.slice(11,16):''} ✓✓</span>`;if(m.admin_reply)h+=`<div style="border-top:1px solid #ffffff22;margin-top:6px;padding-top:4px;color:#53bdeb"><b>Support:</b> ${m.admin_reply}</div>`;div.innerHTML=h;b.appendChild(div);if(m.admin_reply&&!m.admin_reply.includes('/static/')){let a=document.createElement('div');a.className='bubble them';a.innerHTML=`${m.admin_reply}`;b.appendChild(a);}});b.scrollTop=b.scrollHeight;}
async function sendMsg(){let i=document.getElementById('msgInput');let t=i.value.trim();if(!t)return;i.value='';await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});load();}
async function sendImage(){let f=document.getElementById('imgInput').files[0];if(!f)return;let fd=new FormData();fd.append('image',f);await fetch('/api/chat/send-image',{method:'POST',body:fd});load();}
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendMsg()});load();setInterval(load,3000);
</script></body></html>
