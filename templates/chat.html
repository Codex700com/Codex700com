<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Support Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto}
body{background:#111b21;height:100vh;display:flex;flex-direction:column}
.top{background:#202c33;color:#fff;padding:12px 15px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.top img{width:40px;height:40px;border-radius:50%;background:#00a884}
.top h4{font-size:16px} .top small{color:#8696a0;font-size:12px}
.chat-bg{flex:1;overflow-y:auto;padding:12px;background:#0b141a;background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');background-repeat:repeat;opacity:1}
.bubble{max-width:75%;padding:8px 10px;border-radius:8px;margin:6px 0;position:relative;font-size:14.5px;line-height:19px;word-wrap:break-word}
.me{background:#005c4b;color:#e9edef;margin-left:auto;border-top-right-radius:0}
.them{background:#202c33;color:#e9edef;margin-right:auto;border-top-left-radius:0}
.time{font-size:11px;color:#8696a0;float:right;margin-left:8px;margin-top:6px}
.check{color:#53bdeb;font-size:12px}
.input-bar{background:#202c33;padding:8px 10px;display:flex;align-items:center;gap:8px}
.input-bar input{flex:1;background:#2a3942;border:none;border-radius:20px;padding:12px 15px;color:#fff;outline:none;font-size:15px}
.btn-send{background:#00a884;border:none;width:45px;height:45px;border-radius:50%;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.admin-reply{font-size:12px;color:#53bdeb;margin-top:4px;border-top:1px solid #ffffff12;padding-top:4px}
</style>
</head>
<body>
<div class="top">
<a href="/home" style="color:#fff;text-decoration:none;font-size:22px">←</a>
<img src="https://cdn-icons-png.flaticon.com/512/1041/1041916.png">
<div><h4>Support Team</h4><small>Online • Replies in minutes</small></div>
</div>

<div class="chat-bg" id="chatBox"></div>

<div class="input-bar">
<input id="msgInput" placeholder="Message" autocomplete="off">
<button class="btn-send" onclick="sendMsg()">➤</button>
</div>

<script>
let uid = "{{session.get('uid','')}}";
async function loadChats(){
  let res = await fetch('/api/chat/history');
  let data = await res.json();
  let box = document.getElementById('chatBox');
  box.innerHTML='';
  data.forEach(m=>{
    let isMe = true;
    let div = document.createElement('div');
    div.className = 'bubble ' + (isMe ? 'me' : 'me'); // user messages on right
    // user message
    let html = `${m.message}<span class=time>${m.created_at ? m.created_at.slice(11,16) : ''} <span class=check>✓✓</span></span>`;
    if(m.admin_reply){
      html += `<div class=admin-reply><b>Support:</b> ${m.admin_reply}</div>`;
    }
    // if admin_reply exists, show as them bubble too
    if(m.admin_reply){
      let adminDiv = document.createElement('div');
      adminDiv.className='bubble them';
      adminDiv.innerHTML=`${m.admin_reply}<span class=time>${m.created_at ? m.created_at.slice(11,16) : ''}</span>`;
      box.appendChild(div);
      div.innerHTML=html;
      setTimeout(()=>{box.appendChild(adminDiv)},100);
    } else {
      div.innerHTML=html;
      box.appendChild(div);
    }
  });
  // if no admin reply yet, show them as pending
  box.scrollTop = box.scrollHeight;
}

async function sendMsg(){
  let inp=document.getElementById('msgInput');
  let txt=inp.value.trim();
  if(!txt) return;
  inp.value='';
  await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt})});
  loadChats();
}

document.getElementById('msgInput').addEventListener('keypress',function(e){ if(e.key==='Enter') sendMsg(); });

loadChats();
setInterval(loadChats,3000);
</script>
</body>
</html>
