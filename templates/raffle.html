<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raffle</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#020817;
 color:white;
 font-family:Georgia,serif;
 min-height:100vh;
}
.page{
 min-height:100vh;
 padding:18px 20px 95px;
 background:
 radial-gradient(circle at 50% 35%,#08234a 0,#020817 55%,#000 100%);
}
.notice{
 border:1px solid #a66b00;
 border-radius:0 0 28px 28px;
 background:linear-gradient(#211500,#0d0900);
 color:#ffd84d;
 text-align:center;
 font-size:21px;
 line-height:1.45;
 padding:16px 12px 20px;
 margin:-18px -20px 28px;
}
.cards{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px 26px;
 padding:16px 18px;
 border:1px solid #126b91;
 border-radius:22px;
 background:rgba(1,10,25,.7);
 box-shadow:0 0 25px rgba(0,180,255,.15);
}
.card{
 aspect-ratio: .68;
 border-radius:18px;
 border:2px solid #4c247d;
 background:
 radial-gradient(circle at 50% 45%,rgba(40,100,190,.45),transparent 35%),
 linear-gradient(145deg,#0d0a30,#111c48 50%,#18072b);
 box-shadow:
 0 0 8px #182d83,
 inset 0 0 18px rgba(170,40,255,.45);
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 overflow:hidden;
}
.card:before{
 content:"";
 position:absolute;
 inset:7px;
 border:1px solid #6334a0;
 border-radius:12px;
}
.ai{
 position:relative;
 z-index:2;
 width:62px;
 height:62px;
 border:2px solid #8793ad;
 transform:rotate(45deg);
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:0 0 12px #526cbb;
}
.ai span{
 transform:rotate(-45deg);
 font-size:25px;
 color:#c7d1df;
 font-weight:bold;
}
.ready{
 margin-top:28px;
 padding:25px 10px;
 text-align:center;
 border:1px solid #087bb0;
 border-radius:18px;
 background:rgba(4,20,38,.75);
 font-size:30px;
 font-weight:bold;
 box-shadow:0 0 20px rgba(0,170,255,.12);
}
.records{
 margin-top:28px;
 padding:30px 15px;
 min-height:170px;
 border:2px solid #00bfff;
 border-radius:24px 24px 0 0;
 background:rgba(4,16,31,.7);
 text-align:center;
 color:#00c8ff;
 font-size:27px;
 font-weight:bold;
}
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:82px;
 background:transparent;
 border-top:1px solid #111;
 display:grid;
 grid-template-columns:repeat(6,1fr);
 z-index:10;
}
.bottom a{
 text-decoration:none;
 color:white;
 text-align:center;
 font-size:13px;
 padding-top:9px;
}
.bottom i{
 display:block;
 font-style:normal;
 font-size:32px;
 line-height:35px;
}
.bottom .active{
 color:#00c8ff;
}
</style>
</head>

<style>
.wave-bg-global{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:transparent000;overflow:hidden}
.wave-bg-global canvas{display:block;width:100%;height:100%}
</style>
<div class="wave-bg-global"><canvas id="waveCanvasGlobal"></canvas></div>
<script>
(function(){
if(document.getElementById('waveCanvasGlobal').dataset.done) return;
const cvs=document.getElementById('waveCanvasGlobal');
cvs.dataset.done=1;
const ctx=cvs.getContext('2d');
let w,h,dpr;
function resize(){
 dpr=window.devicePixelRatio||1;
 w=cvs.clientWidth; h=cvs.clientHeight;
 cvs.width=w*dpr; cvs.height=h*dpr;
 ctx.scale(dpr,dpr);
}
resize();
window.addEventListener('resize',resize);
let t=0;
function draw(){
 t+=0.015;
 ctx.clearRect(0,0,w,h);
 const cols=28, rows=22;
 const gapX=w/cols, gapY=h/rows;
 for(let y=0;y<rows;y++){
  for(let x=0;x<cols;x++){
   const px=x*gapX + gapX/2;
   const py=y*gapY + gapY/2;
   // wave formula like your image
   const waveX = Math.sin(y*0.35 + t*1.2) * 25;
   const waveY = Math.cos(x*0.3 + t*0.8) * 12;
   const dist = Math.sqrt(Math.pow((x-cols/2)/cols,2)+Math.pow((y-rows/2)/rows,2));
   const alpha = 0.95 - dist*0.9;
   if(alpha<=0) continue;
   const size = 1.8 + Math.sin(t + x*0.2)*0.8;
   ctx.fillStyle=`rgba(120,200,255,${alpha})`;
   ctx.shadowBlur=8;
   ctx.shadowColor='#00c6ff';
   ctx.beginPath();
   ctx.arc(px+waveX, py+waveY, size, 0, Math.PI*2);
   ctx.fill();
   ctx.shadowBlur=0;
  }
 }
 requestAnimationFrame(draw);
}
draw();
})();
</script>
