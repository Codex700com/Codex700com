<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#020210;color:#fff;font-family:Arial;padding-bottom:90px;margin:0}
.card{margin:14px;background:#131e3d;border:1px solid #00e5ff55;border-radius:18px;overflow:hidden}
.vid{height:200px;position:relative;background:#000}
.vid video{width:100%;height:100%;object-fit:cover}
.live{position:absolute;top:10px;left:10px;background:#00ff88;color:#000;font-weight:900;font-size:11px;padding:5px 12px;border-radius:20px}
.hash{position:absolute;top:10px;right:10px;background:#000;color:#0ff;border:1px solid #0ff;font-size:11px;padding:5px 8px;border-radius:8px;font-family:monospace}
.info{padding:12px}
.row{display:flex;justify-content:space-between}
.name{font-size:20px;font-weight:900}
.price{font-weight:900}
.stats{display:flex;justify-content:space-between;background:#0005;padding:10px;border-radius:12px;margin-top:10px}
.s{text-align:center;flex:1}
.sl{font-size:9px;color:#888}
.sv{font-weight:800;margin-top:3px}
.btn{width:100%;margin-top:10px;background:#00aaff;border:none;padding:13px;border-radius:25px;color:#fff;font-weight:900}
</style></head><body>
<div id="list"></div>
<script>
const data=[
["CODEX-A1",250000,8000,800000,7],
["CODEX-A2",500000,18000,1800000,12],
["CODEX-A3",1000000,40000,4000000,20],
["CODEX-A4",2000000,90000,9000000,35]
];
let h="";
data.forEach(d=>{
h+=`<div class="card">
<div class="vid"><video autoplay muted loop playsinline src="/static/ai/live_miner.mp4"></video>
<div class="live">● LIVE ${d[4]} ROBOTS</div>
<div class="hash" id="h${d[0]}">2.34 PH/s</div>
</div>
<div class="info">
<div class="row"><div><div class="name">${d[0]}</div><div style="color:#0f9;font-size:11px">BLOCK #892347 MINING</div></div>
<div><div class="sl">PRICE</div><div class="price">UGX ${d[1].toLocaleString()}</div></div></div>
<div class="stats">
<div class="s"><div class="sl">DAILY</div><div class="sv" style="color:#7affc6">UGX ${d[2].toLocaleString()}</div></div>
<div class="s"><div class="sl">DURATION</div><div class="sv">100 Days</div></div>
<div class="s"><div class="sl">TOTAL</div><div class="sv">UGX ${d[3].toLocaleString()}</div></div>
</div>
<button class="btn" onclick="location.href='/product?p=${d[0]}'">Buy Live Miner - 100 Days</button>
</div></div>`;
});
document.getElementById('list').innerHTML=h;
setInterval(()=>{data.forEach(d=>{let e=document.getElementById('h'+d[0]); if(e) e.innerText=(1.5+Math.random()*3).toFixed(2)+' PH/s'})},900);
</script></body></html>
