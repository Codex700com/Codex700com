<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#000;color:#fff;font-family:Arial;padding:15px;font-size:14px}.card{background:#111;border:1px solid #00b0ff;padding:12px;margin:10px 0;border-radius:8px}img{max-width:100%;border-radius:8px}</style></head><body>
<h2>Pending Deposits</h2>{% for d in rows %}<div class="card">
<b>{{d['name']}}</b> - {{d['amount']}} UGX<br>Phone: {{d['phone_number']}}<br>TxID: {{d['txid']}}<br>
{% if d['screenshot'] %}<img src="/static/uploads/{{d['screenshot']}}">{% endif %}<br>
<a href="/admin/approve/{{d['id']}}" style="background:#00b0ff;color:#000;padding:10px;display:block;text-align:center;border-radius:8px;margin-top:8px;text-decoration:none;font-weight:700">Approve & Add Balance</a>
</div>{% endfor %}</body></html>
