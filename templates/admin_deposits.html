<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><style>body{background:#000;color:#fff;font-family:Arial;padding:15px;font-size:14px}.card{background:#111;border:1px solid #00b0ff;padding:12px;margin:10px 0;border-radius:8px}img{max-width:100%;border-radius:8px}</style><style>
body{background:radial-gradient(ellipse at top,#0a1e3f 0%,#050a14 60%)!important;color:#e0f0ff!important;font-family:Arial,sans-serif!important}
.card,.container,.box{background:#111!important;border:1px solid rgba(0,229,255,0.25)!important;border-radius:12px!important;box-shadow:0 0 20px rgba(30,144,255,0.15)!important;color:#e0f0ff!important}
h1,h2,h3{color:#00e5ff!important;text-shadow:0 0 12px rgba(0,229,255,0.6)!important}
button,.btn{background:linear-gradient(90deg,#1e90ff,#00e5ff)!important;color:#001220!important;border:none!important;border-radius:8px!important;font-weight:800!important;box-shadow:0 0 15px rgba(0,229,255,0.4)!important}
.num,.balance,.amount{color:#00ff88!important;text-shadow:0 0 12px rgba(0,255,136,0.6)!important}
a{color:#00e5ff!important}
input,select{background:#050a14!important;color:#fff!important;border:1px solid #00b0ff!important;border-radius:8px!important}
</style>
</head><body>
<h2>Pending Deposits</h2>{% for d in rows %}<div class="card">
<b>{{d['name']}}</b> - {{d['amount']}} UGX<br>Phone: {{d['phone_number']}}<br>TxID: {{d['txid']}}<br>
{% if d['screenshot'] %}<img src="/static/uploads/{{d['screenshot']}}">{% endif %}<br>
<a href="/admin/approve/{{d['id']}}" style="background:#00b0ff;color:#000;padding:10px;display:block;text-align:center;border-radius:8px;margin-top:8px;text-decoration:none;font-weight:700">Approve & Add Balance</a>
</div>{% endfor %}</body></html>
