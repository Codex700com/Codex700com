<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><style>body{background:transparent;color:#fff;font-family:Arial;padding:15px;font-size:14px}.row{background:#111;border:1px solid #00b0ff;padding:10px;margin:8px 0;border-radius:8px}</style><style>
body{background:radial-gradient(ellipse at top,#0a1e3f 0%,#050a14 60%)!important;color:#e0f0ff!important;font-family:Arial,sans-serif!important}
.card,.container,.box{background:#111!important;border:1px solid rgba(0,229,255,0.25)!important;border-radius:12px!important;box-shadow:0 0 20px rgba(30,144,255,0.15)!important;color:#e0f0ff!important}
h1,h2,h3{color:#00e5ff!important;text-shadow:0 0 12px rgba(0,229,255,0.6)!important}
button,.btn{background:linear-gradient(90deg,#1e90ff,#00e5ff)!important;color:#001220!important;border:none!important;border-radius:8px!important;font-weight:800!important;box-shadow:0 0 15px rgba(0,229,255,0.4)!important}
.num,.balance,.amount{color:#00ff88!important;text-shadow:0 0 12px rgba(0,255,136,0.6)!important}
a{color:#00e5ff!important}
input,select{background:#050a14!important;color:#fff!important;border:1px solid #00b0ff!important;border-radius:8px!important}
</style>
</head>
<style>
.wave-bg-global{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:transparent000;overflow:hidden}
.wave-bg-global canvas{display:block;width:100%;height:100%}
</style>
<div class="wave-bg-global"><canvas id="waveCanvasGlobal"></canvas></div>
<script>
(function(){
if(document.getElementById('waveCanvasGlobal').dataset.done) return;
const cvs=document.getElementById('waveCanvasGlobal');
cvs.dataset.done=1;
const ctx=cvs.getContext('2d');
let w,h,dpr;
function resize(){
 dpr=window.devicePixelRatio||1;
 w=cvs.clientWidth; h=cvs.clientHeight;
 cvs.width=w*dpr; cvs.height=h*dpr;
 ctx.scale(dpr,dpr);
}
resize();
window.addEventListener('resize',resize);
let t=0;
function draw(){
 t+=0.015;
 ctx.clearRect(0,0,w,h);
 const cols=28, rows=22;
 const gapX=w/cols, gapY=h/rows;
 for(let y=0;y<rows;y++){
  for(let x=0;x<cols;x++){
   const px=x*gapX + gapX/2;
   const py=y*gapY + gapY/2;
   // wave formula like your image
   const waveX = Math.sin(y*0.35 + t*1.2) * 25;
   const waveY = Math.cos(x*0.3 + t*0.8) * 12;
   const dist = Math.sqrt(Math.pow((x-cols/2)/cols,2)+Math.pow((y-rows/2)/rows,2));
   const alpha = 0.95 - dist*0.9;
   if(alpha<=0) continue;
   const size = 1.8 + Math.sin(t + x*0.2)*0.8;
   ctx.fillStyle=`rgba(120,200,255,${alpha})`;
   ctx.shadowBlur=8;
   ctx.shadowColor='#00c6ff';
   ctx.beginPath();
   ctx.arc(px+waveX, py+waveY, size, 0, Math.PI*2);
   ctx.fill();
   ctx.shadowBlur=0;
  }
 }
 requestAnimationFrame(draw);
}
draw();
})();
</script>
<body>
<h2>Transaction History</h2>{% for r in rows %}<div class="row">{{r['type']}} - {{r['amount']}} - <b>{{r['status']}}</b><br><small>Reference: {{r['ref']}}</small></div>{% endfor %}</body></html>
