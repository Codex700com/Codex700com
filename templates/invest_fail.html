<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><style>body{background:transparent;color:#fff;font-family:sans-serif;text-align:center;padding:20px}.card{background:#111;border:1px solid #ff4444;border-radius:16px;padding:20px;margin:20px auto;max-width:400px}.red{color:#ff4444;font-size:50px}.btn{padding:12px 20px;border-radius:10px;text-decoration:none;display:inline-block;margin:8px;font-weight:800}.green{background:#16a34a;color:#fff}.blue{background:#1a1a1a;color:#fff;border:1px solid #333}</style></head>
<style>
.wave-bg-global{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:transparent000;overflow:hidden}
.wave-bg-global canvas{display:block;width:100%;height:100%}
</style>
<div class="wave-bg-global"><canvas id="waveCanvasGlobal"></canvas></div>
<script>
(function(){
if(document.getElementById('waveCanvasGlobal').dataset.done) return;
const cvs=document.getElementById('waveCanvasGlobal');
cvs.dataset.done=1;
const ctx=cvs.getContext('2d');
let w,h,dpr;
function resize(){
 dpr=window.devicePixelRatio||1;
 w=cvs.clientWidth; h=cvs.clientHeight;
 cvs.width=w*dpr; cvs.height=h*dpr;
 ctx.scale(dpr,dpr);
}
resize();
window.addEventListener('resize',resize);
let t=0;
function draw(){
 t+=0.015;
 ctx.clearRect(0,0,w,h);
 const cols=28, rows=22;
 const gapX=w/cols, gapY=h/rows;
 for(let y=0;y<rows;y++){
  for(let x=0;x<cols;x++){
   const px=x*gapX + gapX/2;
   const py=y*gapY + gapY/2;
   // wave formula like your image
   const waveX = Math.sin(y*0.35 + t*1.2) * 25;
   const waveY = Math.cos(x*0.3 + t*0.8) * 12;
   const dist = Math.sqrt(Math.pow((x-cols/2)/cols,2)+Math.pow((y-rows/2)/rows,2));
   const alpha = 0.95 - dist*0.9;
   if(alpha<=0) continue;
   const size = 1.8 + Math.sin(t + x*0.2)*0.8;
   ctx.fillStyle=`rgba(120,200,255,${alpha})`;
   ctx.shadowBlur=8;
   ctx.shadowColor='#00c6ff';
   ctx.beginPath();
   ctx.arc(px+waveX, py+waveY, size, 0, Math.PI*2);
   ctx.fill();
   ctx.shadowBlur=0;
  }
 }
 requestAnimationFrame(draw);
}
draw();
})();
</script>
<body>
<div class="card"><div class="red">❌</div><h2>Insufficient Balance</h2><p>Plan: <b>{{ plan_name }}</b></p><p>Need: <b>UGX {{ amount }}</b></p><p>Your Balance: <b style="color:#ffcc00">UGX {{ balance }}</b></p><p>Daily: {{ daily }} | Duration: {{ duration }} days | Total: {{ total }}</p><a href="/deposit" class="btn green">Deposit Now</a><a href="/" class="btn blue">Back to Home</a></div>
</body></html>
