<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#000;color:#fff;font-family:Arial;padding:15px;font-size:14px}input{width:100%;padding:12px;margin:8px 0;background:#111;color:#fff;border:1px solid #00b0ff;border-radius:8px}button{background:#00b0ff;color:#000;padding:12px;width:100%;border:none;border-radius:8px;font-weight:700}</style></head><body>
<h2>Deposit</h2><form method="POST" enctype="multipart/form-data">
<input name="phone_number" placeholder="Number you deposited from" required>
<input name="amount" type="number" placeholder="Amount" required>
<input name="txid" placeholder="Transaction ID" required>
<label>Screenshot proof:</label><input type="file" name="screenshot" accept="image/*" required>
<button>Confirm Deposit</button></form></body></html>
