<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body{background:radial-gradient(ellipse at top,#0a1e3f 0%,#050a14 60%)!important;color:#e0f0ff;font-family:Arial;padding:12px;font-size:14px;margin:0}
.card{background:#111!important;border:1px solid rgba(0,229,255,0.25)!important;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 0 20px rgba(30,144,255,0.15)}
.card h3{color:#00e5ff!important;margin:0 0 10px;font-size:14px;text-shadow:0 0 10px rgba(0,229,255,0.5)}
.num{color:#00ff88!important;font-size:22px;font-weight:900;text-shadow:0 0 12px rgba(0,255,136,0.6)}
.timer{color:#00e5ff;font-weight:700;margin-top:8px}
input{width:100%;padding:12px;margin:8px 0;background:#050a14;color:#fff;border:1px solid #00b0ff;border-radius:8px;box-sizing:border-box}
button{background:linear-gradient(90deg,#1e90ff,#00e5ff)!important;color:#001220!important;padding:14px;width:100%;border:none;border-radius:8px;font-weight:800;box-shadow:0 0 15px rgba(0,229,255,0.4);cursor:pointer}
h2{color:#00e5ff!important;text-shadow:0 0 12px rgba(0,229,255,0.6)}
</style>
</head>
<style>
.wave-bg-global{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:transparent000;overflow:hidden}
.wave-bg-global canvas{display:block;width:100%;height:100%}
</style>
<div class="wave-bg-global"><canvas id="waveCanvasGlobal"></canvas></div>
<script>
(function(){
if(document.getElementById('waveCanvasGlobal').dataset.done) return;
const cvs=document.getElementById('waveCanvasGlobal');
cvs.dataset.done=1;
const ctx=cvs.getContext('2d');
let w,h,dpr;
function resize(){
 dpr=window.devicePixelRatio||1;
 w=cvs.clientWidth; h=cvs.clientHeight;
 cvs.width=w*dpr; cvs.height=h*dpr;
 ctx.scale(dpr,dpr);
}
resize();
window.addEventListener('resize',resize);
let t=0;
function draw(){
 t+=0.015;
 ctx.clearRect(0,0,w,h);
 const cols=28, rows=22;
 const gapX=w/cols, gapY=h/rows;
 for(let y=0;y<rows;y++){
  for(let x=0;x<cols;x++){
   const px=x*gapX + gapX/2;
   const py=y*gapY + gapY/2;
   // wave formula like your image
   const waveX = Math.sin(y*0.35 + t*1.2) * 25;
   const waveY = Math.cos(x*0.3 + t*0.8) * 12;
   const dist = Math.sqrt(Math.pow((x-cols/2)/cols,2)+Math.pow((y-rows/2)/rows,2));
   const alpha = 0.95 - dist*0.9;
   if(alpha<=0) continue;
   const size = 1.8 + Math.sin(t + x*0.2)*0.8;
   ctx.fillStyle=`rgba(120,200,255,${alpha})`;
   ctx.shadowBlur=8;
   ctx.shadowColor='#00c6ff';
   ctx.beginPath();
   ctx.arc(px+waveX, py+waveY, size, 0, Math.PI*2);
   ctx.fill();
   ctx.shadowBlur=0;
  }
 }
 requestAnimationFrame(draw);
}
draw();
})();
</script>
<body>
<h2>Deposit</h2>
<div class="card">
<h3>SEND MONEY TO</h3>
<div><b id="aname">Shakira Nantongo</b><br><span class="num" id="anum">0758878297</span><br><span style="color:#ff4444">🔥 airtel money</span></div>
<div class="timer">Expires in: <span id="count">05:00</span></div>
<div style="color:#ffb700;font-size:12px;margin-top:6px;cursor:pointer" onclick="copyNum()">📋 Copy Number</div>
</div>
<div class="card"><h3>HOW TO DEPOSIT</h3><ol style="color:#ddd;line-height:1.8;margin:0;padding-left:20px">
<li>Dial *185# on your Airtel line</li><li>Select Send Money</li><li>Send money to <span id="anum2">0758878297</span></li>
<li>Enter amount</li><li>Fill details below</li><li>Upload screenshot</li><li>Click "Confirm Deposit"</li></ol></div>
<form action="/deposit-submit" method="POST" enctype="multipart/form-data">
<input name="phone_number" placeholder="Number you deposited from" required>
<input name="amount" type="number" placeholder="Amount" required>
<input name="txid" placeholder="Transaction ID" required>
<label>Screenshot proof:</label><input type="file" name="screenshot" accept="image/*" required>
<button>Confirm Deposit</button></form>
<script>
const nums=[{n:"0758878297",a:"Shakira Nantongo"},{n:"0757837051",a:"Mary Namara"}];
let idx=0, sec=300;
function copyNum(){navigator.clipboard.writeText(document.getElementById('anum').innerText);alert('Copied');}
setInterval(()=>{
 sec--;
 if(sec<=0){idx=(idx+1)%nums.length;sec=300;}
 document.getElementById('anum').innerText=nums[idx].n;
 document.getElementById('anum2').innerText=nums[idx].n;
 document.getElementById('aname').innerText=nums[idx].a;
 let m=String(Math.floor(sec/60)).padStart(2,'0'), s=String(sec%60).padStart(2,'0');
 document.getElementById('count').innerText=m+":"+s;
},1000);
</script>
</body></html>
