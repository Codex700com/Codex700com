<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:10px}
.balance-box{border:1px solid #ffcc00;border-radius:12px;padding:12px;display:flex;justify-content:space-between}
.balance-amt{color:red;font-size:22px;font-weight:bold}
.section-title{color:#ffcc00;font-weight:bold;margin:15px 0 8px}
input{width:95%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;margin:5px 0}
.pay-methods{display:flex;gap:10px}
.pay{flex:1;border:1px solid #ffcc00;border-radius:8px;padding:10px;text-align:center;background:#1a1a1a}
.summary{background:#111;border-radius:8px;padding:12px}
.row{display:flex;justify-content:space-between;padding:4px 0}
.confirm{background:red;color:#fff;border:0;width:100%;padding:14px;border-radius:8px;font-weight:bold;margin-top:12px}
.important{border:1px solid red;border-radius:8px;padding:10px;margin-top:12px;font-size:13px}
</style></head><body>
<div style="text-align:center;font-weight:bold">WITHDRAW</div>
<div class="balance-box"><div><div style="font-size:13px">Available Balance</div><div class="balance-amt">UGX 3,068,000</div></div><div>👁️</div></div>
<div class="section-title">WITHDRAWAL DETAILS</div>
<input id="amt" placeholder="Enter amount to withdraw" oninput="document.getElementById('s_amt').innerText='UGX '+Number(this.value||0).toLocaleString();document.getElementById('s_rec').innerText='UGX '+Number(this.value||0).toLocaleString()">
<div class="section-title">WITHDRAWAL SUMMARY</div>
<div class="summary"><div class="row"><span>Withdrawal Amount</span><span id="s_amt">UGX 0</span></div><div class="row"><b>You Will Receive</b><b id="s_rec" style="color:red">UGX 0</b></div></div>
<div class="important"><b style="color:red">IMPORTANT</b><br>• Make sure your mobile money number is correct.<br>• Withdrawals are processed within 1-24 hours.</div>
<button class="confirm">CONFIRM WITHDRAWAL</button>
</body></html>
