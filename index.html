<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODEX700 - REGISTER</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.logo{color:#FFC107;font-size:28px;font-weight:900;margin:30px 0 20px;letter-spacing:1px}
.card{width:100%;max-width:420px;background:#0a0a0a;border:2px solid #FFC107;border-radius:20px;padding:30px 20px;box-shadow:0 0 25px rgba(255,193,7,.4)}
.card h2{color:#FFC107;text-align:center;font-size:28px;margin-bottom:25px;font-weight:900}
label{color:#D4A017;display:block;margin:15px 0 8px;font-size:16px}
input{width:100%;padding:15px;background:#111;border:1px solid #8a6d00;border-radius:12px;color:#fff;font-size:16px;outline:none}
input:focus{border-color:#FFC107}
input::placeholder{color:#666}
.btn{width:100%;margin-top:25px;padding:16px;background:linear-gradient(180deg,#FFC107,#FF9800);border:none;border-radius:12px;font-size:20px;font-weight:900;color:#000;cursor:pointer}
.login-text{text-align:center;margin-top:18px;font-size:16px}
.login-text a{color:#FFC107;text-decoration:underline}
</style>
</head>
<body>
<div class="logo">CODEX700</div>
<div class="card">
<h2>REGISTER</h2>
<form>
<label>Name</label>
<input type="text" placeholder="Enter Name" required>
<label>Phone number</label>
<input type="tel" placeholder="Enter Phone number" required>
<label>Password</label>
<input type="password" placeholder="Enter Password" required>
<label>Confirm password</label>
<input type="password" placeholder="Confirm Password" required>
<label>Invitation code</label>
<input type="text" placeholder="Invitation code">
<button type="submit" class="btn">REGISTER</button>
</form>
<div class="login-text">Have account? <a href="#">Login</a></div>
</div>
</body>
</html>
