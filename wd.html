<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:10px}.balance-amt{color:red;font-size:22px;font-weight:bold}.section-title{color:#ffcc00;font-weight:bold;margin:15px 0 8px}input{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;margin:6px 0;box-sizing:border-box}.confirm{background:red;color:#fff;border:0;width:100%;padding:14px;border-radius:8px;margin-top:12px}</style></head><body><div style="text-align:center;font-weight:bold">WITHDRAW</div><div style="border:1px solid #ffcc00;border-radius:12px;padding:12px;margin-top:10px">Available Balance<div class="balance-amt">UGX __BAL__</div></div><div class="section-title">WITHDRAWAL DETAILS</div><input id="amt" type="number" placeholder="Enter amount" oninput="upd()"><div style="font-size:12px">Minimum: <span style="color:red">UGX 10,000</span></div><input id="phone" placeholder="Enter mobile number"><div class="section-title">SUMMARY</div><div>Amount: <span id="s_amt">UGX 0</span></div><div>Fee (9.8%): <span id="s_fee">UGX 0</span></div><div>You Receive: <b id="s_rec" style="color:red">UGX 0</b></div><button class="confirm" onclick="sub()">CONFIRM WITHDRAWAL</button><p id="msg"></p><script>function upd(){let v=Number(document.getElementById('amt').value||0);let f=Math.round(v*0.098);document.getElementById('s_amt').innerText='UGX '+v.toLocaleString();document.getElementById('s_fee').innerText='UGX '+f.toLocaleString();document.getElementById('s_rec').innerText='UGX '+(v-f).toLocaleString()}function sub(){fetch('/withdraw_submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:document.getElementById('amt').value,phone:document.getElementById('phone').value})}).then(r=>r.json()).then(d=>{document.getElementById('msg').style.color=d.ok?'lime':'red';document.getElementById('msg').innerText=d.msg})}</script></body></html>
