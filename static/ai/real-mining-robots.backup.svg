<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#020609"/><stop offset=".55" stop-color="#08151a"/><stop offset="1" stop-color="#00131c"/>
 </linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#d7e1e4"/><stop offset=".3" stop-color="#718086"/><stop offset=".65" stop-color="#29363b"/><stop offset="1" stop-color="#080d10"/>
 </linearGradient>
 <filter id="blueglow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="800" height="500" fill="url(#bg)"/>

<!-- underground mining environment -->
<path d="M0 370 Q160 330 300 365 T600 350 T800 365 V500 H0Z" fill="#11191d"/>
<path d="M0 400 Q180 375 350 405 T800 390 V500 H0Z" fill="#080d10"/>

<!-- tunnel supports -->
<g fill="none" stroke="#46545a" stroke-width="12">
 <path d="M40 370V170 Q40 105 105 105H190 Q255 105 255 170V365"/>
 <path d="M540 365V170 Q540 105 605 105H690 Q755 105 755 170V370"/>
</g>

<!-- ROBOT 1: drilling/mining machine -->
<g>
 <animateTransform attributeName="transform" type="translate"
 values="0 0;10 0;0 0;-8 0;0 0" dur="3s" repeatCount="indefinite"/>

 <!-- wheels -->
 <g fill="#080d10" stroke="#8d9ba0" stroke-width="7">
  <circle cx="145" cy="400" r="42"/>
  <circle cx="270" cy="400" r="42"/>
 </g>

 <!-- body -->
 <rect x="110" y="260" width="190" height="115" rx="15" fill="url(#steel)" stroke="#00b9f3" stroke-width="4"/>

 <!-- computer/control screen -->
 <rect x="145" y="285" width="90" height="55" rx="6" fill="#031015" stroke="#00d9ff" stroke-width="3"/>
 <path d="M157 326 L175 310 L190 319 L210 296 L225 320" fill="none" stroke="#00eaff" stroke-width="3"/>
 <circle cx="215" cy="300" r="5" fill="#00eaff" filter="url(#blueglow)">
  <animate attributeName="opacity" values=".2;1;.2" dur="1s" repeatCount="indefinite"/>
 </circle>

 <!-- hydraulic mining arm -->
 <g>
  <animateTransform attributeName="transform" type="rotate"
   values="-3 285 280;8 285 280;-3 285 280" dur="2.2s" repeatCount="indefinite"/>
  <rect x="275" y="170" width="30" height="120" rx="10" fill="#4c5b60" stroke="#aab8bc" stroke-width="4"/>
  <rect x="285" y="105" width="22" height="100" rx="8" fill="#7b898d"/>
  <!-- drill -->
  <g transform="translate(296 85)">
   <polygon points="-20,0 20,0 0,-48" fill="#aeb9bc"/>
   <polygon points="-13,-18 13,-18 0,-65" fill="#e0e7e8"/>
   <animateTransform attributeName="transform" type="rotate"
    from="0 0 0" to="360 0 0" dur=".35s" repeatCount="indefinite"/>
  </g>
 </g>

 <!-- headlights -->
 <circle cx="125" cy="275" r="9" fill="#00eaff" filter="url(#blueglow)">
  <animate attributeName="opacity" values=".3;1;.3" dur=".8s" repeatCount="indefinite"/>
 </circle>
</g>

<!-- ROBOT 2: excavator with axe -->
<g>
 <animateTransform attributeName="transform" type="translate"
 values="0 0;-8 0;0 0;8 0;0 0" dur="3.5s" repeatCount="indefinite"/>

 <!-- tracks -->
 <rect x="415" y="390" width="190" height="55" rx="25" fill="#101719" stroke="#727f83" stroke-width="6"/>
 <g fill="#3c484c">
  <circle cx="445" cy="418" r="18"/><circle cx="490" cy="418" r="18"/>
  <circle cx="535" cy="418" r="18"/><circle cx="580" cy="418" r="18"/>
 </g>

 <!-- cabin -->
 <path d="M450 285 L500 245 H575 L605 290 V390 H450Z" fill="url(#steel)" stroke="#00b9f3" stroke-width="4"/>
 <rect x="480" y="270" width="75" height="65" fill="#06151b" stroke="#00d9ff" stroke-width="3"/>
 <rect x="494" y="282" width="45" height="8" fill="#00eaff">
  <animate attributeName="width" values="20;45;20" dur="1.3s" repeatCount="indefinite"/>
 </rect>

 <!-- excavator arm -->
 <g>
  <animateTransform attributeName="transform" type="rotate"
   values="-8 575 300;8 575 300;-8 575 300" dur="2.5s" repeatCount="indefinite"/>
  <rect x="570" y="170" width="32" height="145" rx="9" fill="#59666a" stroke="#aab5b8" stroke-width="4"/>
  <rect x="590" y="110" width="28" height="100" rx="8" fill="#7d898c" stroke="#b7c2c5" stroke-width="3"/>

  <!-- axe -->
  <g transform="translate(604 85)">
   <rect x="-5" y="-5" width="10" height="80" fill="#6f4b2e"/>
   <path d="M-42 -8 Q0 -45 42 -8 L30 24 Q0 8 -30 24Z" fill="#cbd4d6" stroke="#6c777b" stroke-width="4"/>
   <animateTransform attributeName="transform" type="rotate"
    values="-10 0 0;10 0 0;-10 0 0" dur="1.1s" repeatCount="indefinite"/>
  </g>
 </g>

 <circle cx="470" cy="300" r="8" fill="#00eaff" filter="url(#blueglow)">
  <animate attributeName="opacity" values=".2;1;.2" dur=".7s" repeatCount="indefinite"/>
 </circle>
</g>

<!-- flying dust / mining particles -->
<g fill="#aeb8b9">
 <circle cx="340" cy="365" r="4"><animate attributeName="cy" values="365;330;365" dur=".8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></circle>
 <circle cx="365" cy="350" r="3"><animate attributeName="cy" values="350;315;350" dur="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></circle>
 <circle cx="635" cy="355" r="4"><animate attributeName="cy" values="355;320;355" dur=".9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></circle>
</g>

<text x="400" y="475" text-anchor="middle" fill="#00cfff"
 font-family="Arial,sans-serif" font-size="18" font-weight="bold"
 letter-spacing="4">CODEX AI • AUTONOMOUS MINING</text>
</svg>
